version: '3'

vars:
  LOCATION: deployments/myorg/poc/use1

tasks:
  ci:validate:
    desc: Format-check and validate each Terraform root without AWS credentials
    cmds:
      - terraform fmt -check -recursive
      - |
        for root in {{.LOCATION}}/*/main.tf; do
          stack_dir="${root%/main.tf}"
          terraform -chdir="$stack_dir" init -backend=false -input=false
          terraform -chdir="$stack_dir" validate
        done

  tf:plan:
    desc: Save a reviewable plan for an existing S3-backed stack
    requires:
      vars: [STACK]
    cmds:
      - terraform -chdir={{.LOCATION}}/{{.STACK}} init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - terraform -chdir={{.LOCATION}}/{{.STACK}} plan -input=false -out=tfplan

  tf:apply:
    desc: Apply the exact existing tfplan in the selected stack
    requires:
      vars: [STACK]
    cmds:
      - terraform -chdir={{.LOCATION}}/{{.STACK}} init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - terraform -chdir={{.LOCATION}}/{{.STACK}} apply -input=false tfplan

  image:validate:
    desc: Validate both Packer image definitions
    cmds:
      - |
        for image in application database; do
          (cd images/myorg/poc/use1/"$image" &&
            packer init . &&
            packer fmt -check . &&
            packer validate -syntax-only -var-file=config/image.pkrvars.hcl .)
        done

  image:build:
    desc: Build one Packer image and publish its AMI ID to SSM
    requires:
      vars: [IMAGE]
    cmds:
      - |
        cd images/myorg/poc/use1/{{.IMAGE}}
        packer init .
        packer build -var-file=config/image.pkrvars.hcl .
        ami_id="$(jq -r '.builds[-1].artifact_id | split(":")[-1]' manifest.json)"
        aws ssm put-parameter --region us-east-1 --name /myorg/poc/use1/ami/{{.IMAGE}} --type String --value "$ami_id" --overwrite

  architecture:modernized:
    desc: Generate modernized Pulumi target architecture SVG locally without AWS
    cmds:
      - .venv/bin/python scripts/build-modernized-architecture-graph.py --output docs/architecture/myorg-poc-use1-modernized.tvg.json
      - .venv/bin/terravision draw --source docs/architecture/myorg-poc-use1-modernized.tvg.json --format svg --outfile docs/architecture/myorg-poc-use1-modernized --title 'MyOrg POC use1 - Modernized Pulumi (planned)'
