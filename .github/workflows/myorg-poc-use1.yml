name: MyOrg POC use1 Terraform

on:
  pull_request:
    paths:
      - 'deployments/myorg/poc/use1/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/myorg-poc-use1.yml'
      - 'Taskfile.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply]
      stack:
        description: Terraform stack
        required: true
        type: choice
        options:
          - terraform-state
          - vpc
          - iam
          - logging
          - route53
          - acm
          - firewall
          - ec2
          - dlm

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
      - name: Validate use1 Terraform
        shell: bash
        run: bash deployments/myorg/poc/use1/ci/run.sh validate

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Plan selected stack
        shell: bash
        run: bash deployments/myorg/poc/use1/ci/run.sh plan '${{ inputs.stack }}'

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: validate
    runs-on: ubuntu-24.04
    environment: myorg-poc-use1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Apply selected stack
        shell: bash
        run: bash deployments/myorg/poc/use1/ci/run.sh apply '${{ inputs.stack }}'
