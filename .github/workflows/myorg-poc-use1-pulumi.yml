name: MyOrg POC use1 Pulumi (static review only)

on:
  pull_request:
    paths:
      - 'deployments/myorg/poc/use1/ecs/**'
      - 'containers/myorg/poc/use1/application/**'
      - '.github/workflows/myorg-poc-use1-pulumi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deployments/myorg/poc/use1/ecs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deployments/myorg/poc/use1/ecs/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck

  # No AWS/OIDC credentials and no Pulumi preview/up in CI. A real preview is
  # an operator-controlled action against reviewed configuration and state.
