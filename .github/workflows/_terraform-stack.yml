name: Terraform stack

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      operation:
        required: true
        type: string
    secrets: {}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  STACK_DIR: deployments/myorg/poc/use1/${{ inputs.stack }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize without backend or AWS credentials
        run: terraform -chdir="$STACK_DIR" init -backend=false -input=false
      - name: Validate
        run: terraform -chdir="$STACK_DIR" validate

  plan:
    if: inputs.operation == 'plan' || inputs.operation == 'apply'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize stack backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [[ "${{ inputs.stack }}" == terraform-state ]] && ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" >/dev/null 2>&1; then
            printf '%s\n' local > "$STACK_DIR/backend-mode.txt"
            terraform -chdir="$STACK_DIR" init -backend=false -input=false
          else
            printf '%s\n' s3 > "$STACK_DIR/backend-mode.txt"
            terraform -chdir="$STACK_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          fi
      - name: Save exact plan
        run: |
          terraform -chdir="$STACK_DIR" plan -input=false -out=tfplan
          terraform -chdir="$STACK_DIR" show -no-color tfplan > "$STACK_DIR/plan.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfplan-${{ inputs.stack }}
          path: |
            ${{ env.STACK_DIR }}/tfplan
            ${{ env.STACK_DIR }}/plan.txt
            ${{ env.STACK_DIR }}/backend-mode.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    if: inputs.operation == 'apply'
    needs: plan
    runs-on: ubuntu-24.04
    environment: myorg-poc-use1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfplan-${{ inputs.stack }}
          path: ${{ env.STACK_DIR }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize backend used by saved plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [[ "$(cat "$STACK_DIR/backend-mode.txt")" == local ]]; then
            terraform -chdir="$STACK_DIR" init -backend=false -input=false
          else
            terraform -chdir="$STACK_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
          fi
      - name: Apply reviewed plan artifact
        run: terraform -chdir="$STACK_DIR" apply -input=false tfplan
      - name: Migrate first-time state bootstrap to S3
        if: inputs.stack == 'terraform-state'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [[ "$(cat "$STACK_DIR/backend-mode.txt")" == local ]]; then
            terraform -chdir="$STACK_DIR" init -input=false -migrate-state -force-copy -backend-config="bucket=$TF_STATE_BUCKET"
          fi
